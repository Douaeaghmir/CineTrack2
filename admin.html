<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>CineTrack</title>
</head>

<body class="bg-black">
    <header class="bg-black px-4 sm:px-6 lg:px-10 py-3 border-b border-red-800">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center justify-center shrink-0">
                <img src="src/img/logo.png" alt="Action logo"
                    class="w-14 h-14 sm:w-16 sm:h-16 lg:w-20 lg:h-20 object-contain">
                <img src="src/img/title.png" alt="CineTrack"
                    class="w-28 h-14 sm:w-32 sm:h-16 lg:w-36 lg:h-20 object-contain">
            </div>
            <div class="flex items-center gap-2 sm:gap-3 w-full sm:w-auto">
                <img src="src/img/profile-removebg-preview.png" alt="profile"
                    class="w-7 h-7 sm:w-8 sm:h-8 object-contain shrink-0">
            </div>
        </div>
    </header>
    <div class="bg-black">
        <button id="ajouter"
            class=" border border-red-600 rounded bg-red-600 font-bold text-white  flex justify-self-end  m-4 px-5 py-2">
            Add + </button>
    </div>
    <main>
        <div id="formContainer" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4">
            <form id="addMovieForm" class="bg-[#202024] text-white p-6 rounded-xl w-full max-w-lg space-y-4 max-h-[90vh] overflow-y-auto">
                <div class="flex items-center justify-between">
                <h2 class="text-lg" id="formTitle">Add a new movie</h2>
                <button id="close" type="button" class="text-white bg-red-600 border border-red-600 rounded p-3 hover:bg-red-800">X</button>
                </div>
                <input type="text" id="title" placeholder="Movie title" class="w-full p-2 rounded bg-black border border-red-800 outline-none" required>
                <select id="type" required class="w-full p-2 rounded bg-black border border-red-800 outline-none">
                    <option value="">Choose type</option>
                    <option value="movie">Movie</option>
                    <option value="series">Series</option>
                </select>
                <input type="number" id="releaseYear" placeholder="Release year" class="w-full p-2 rounded bg-black border border-red-800 outline-none" required>
                <input type="number" id="duration" placeholder="Duration in minutes" class="w-full p-2 rounded bg-black border border-red-800 outline-none" required>
                <input type="text" id="image" placeholder="Image URL" class="w-full p-2 rounded bg-black border border-red-800 outline-none" required>
                <textarea id="description" placeholder="Description" class="w-full p-2 rounded bg-black border border-red-800 outline-none" required></textarea>
                <input type="text" id="genres" placeholder="Genres (comma separated)" class="w-full p-2 rounded bg-black border border-red-800 outline-none" required>
                <input type="text" id="directors" placeholder="Directors (comma separated)" class="w-full p-2 rounded bg-black border border-red-800 outline-none" required>
                <input type="text" id="productionCountries" placeholder="Production countries (comma separated)"
                    class="w-full p-2 rounded bg-black border border-red-800 outline-none" required>
                <button type="submit" id="saveMovie" class="border rounded-md border-red-600 bg-red-600 p-2 mr-2 hover:bg-red-800">Save movie</button>
                <button type="button" id="cancelAdd" class="border rounded-md border-gray-600 bg-gray-600 p-2 ml-2 hover:bg-gray-800">Cancel</button>
            </form>
        </div>
        <div class="bg-[#161619]  p-4 w-full overflow-x-auto bg-black">
            <table class="w-full text-left text-white border-collapse">
                <thead class="bg-[#202024] text-gray-400 text-xs">
                    <tr>
                        <th class="p-4">TITLE</th>
                        <th class="p-4">TYPE</th>
                        <th class="p-4">YEAR</th>
                        <th class="p-4">RATING</th>
                        <th class="p-4">STATUS</th>
                        <th class="p-4">ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="moviesTable" class="text-sm">
                </tbody>
            </table>
        </div>
    </main>
    <footer class="flex justify-center items-center bg-black border-t border-red-800 py-4 px-3">
        <a href="index.html" class="absolute left-3 sm:left-6">
            <span class="text-white border-2 border-red-600 p-2 rounded hover:bg-red-600 transition"> <- go back</span>
        </a>
        <p class="text-white text-sm text-center">© CineTrack · 2026</p>
    </footer>
    <script type="module" src="./src/js/admin-render.js"></script>
</body>

</html>
